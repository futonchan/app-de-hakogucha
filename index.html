<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>アプリでハコグチャ（仮）</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="hud" aria-label="ゲーム情報">
        <div>スコア <strong data-testid="score">0</strong></div>
        <div>残り <strong data-testid="time">60.0</strong>秒</div>
        <div>コンボ <strong data-testid="combo">0</strong></div>
      </section>

      <section class="board-panel">
        <canvas id="game-canvas" width="320" height="384" aria-label="10列12段のゲーム盤"></canvas>
      </section>

      <section class="message-panel" data-testid="message">
        <h1>アプリでハコグチャ（仮）</h1>
        <p>同じ色を3個以上つなげて消す、60秒スコアアタックです。</p>
        <button type="button" data-testid="start">開始</button>
      </section>

      <section class="controls" aria-label="操作">
        <div class="dpad" data-testid="dpad" aria-label="十字キー">
          <button type="button" data-dir="up" data-testid="up" aria-label="上">↑</button>
          <button type="button" data-dir="left" data-testid="left" aria-label="左">←</button>
          <span aria-hidden="true"></span>
          <button type="button" data-dir="right" data-testid="right" aria-label="右">→</button>
          <button type="button" data-dir="down" data-testid="down" aria-label="下">↓</button>
        </div>
        <button type="button" class="punch-button" data-testid="punch" aria-label="パンチ">パンチ</button>
        <div class="side-actions">
          <button type="button" data-testid="pause">ポーズ</button>
          <button type="button" data-testid="resume" hidden>再開</button>
          <button type="button" data-testid="retry">リトライ</button>
        </div>
      </section>

      <section class="help">
        <p>十字キーで移動／箱を1マス押す。パンチは向き方向の隣接箱だけ。灰はHP3です。</p>
        <p>横持ち・非表示・フォーカス喪失ではポーズします。iPhone実機操作感は要確認です。</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
